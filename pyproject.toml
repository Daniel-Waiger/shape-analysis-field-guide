[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapekit"
version = "0.1.0"
description = "A small, readable toolkit for 2-D statistical shape analysis (companion to the Shape Analysis Field Guide)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
embed = ["torch>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["shapekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
