[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapekit"
version = "0.1.0"
description = "A small, readable toolkit for 2-D statistical shape analysis (companion to the Shape Analysis Field Guide)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
embed = ["torch>=2.0"]
# everything scripts/fetch_datasets.py, scripts/run_lab.py and scripts/build_lab_wheel.sh need
# (the Phenotype Lab, chapter 10): torch + onnx for the PointNet and its export, onnxruntime to
# verify it, pyreadr/xarray (or rdata) to read the R package's .rda files, Pillow + contourpy for
# the red-cell masks, build for the Pyodide wheel.
lab = [
    "torch>=2.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "pyreadr>=0.5",
    "xarray>=2023.1",
    "rdata>=0.11",
    "Pillow>=10",
    "contourpy>=1.1",
    "build>=1.0",
]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["shapekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
